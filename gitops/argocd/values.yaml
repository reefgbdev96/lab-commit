# Argo CD install values, applied by `make bootstrap` (server.ingress.hostname is
# set there from the zone).
configs:
  params:
    server.insecure: true # TLS terminates at the internal ALB

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0 # unused; saves a Fargate pod

# Fargate sizes the node from requests; without them the controller gets 0.5 GB
# and is OOM-killed once it caches the kube-prometheus-stack CRDs.
controller:
  resources:
    requests: { cpu: 500m, memory: 1536Mi }
    limits: { memory: 1536Mi }

server:
  ingress:
    enabled: true
    ingressClassName: lab-alb
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
