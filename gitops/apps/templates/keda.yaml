apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "apps.metadata" "keda" }}
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
  {{- include "apps.syncPolicy" dict | nindent 2 }}
