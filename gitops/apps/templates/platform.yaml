# Pinned at the class, so no Ingress can make itself internet-facing or plain HTTP.
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: lab-alb
spec:
  scheme: internal
  targetType: ip # Fargate pods are registered by IP
  group:
    name: lab-commit # one ALB serves the app, Grafana and Argo CD
  certificateArn:
    - {{ include "apps.required" (dict "key" "certificateArn" "value" .Values.certificateArn) }}
  inboundCIDRs:
    - {{ include "apps.required" (dict "key" "vpcCidr" "value" .Values.vpcCidr) }}
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: lab-alb
spec:
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
    kind: IngressClassParams
    name: lab-alb
