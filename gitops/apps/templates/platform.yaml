# Pinned at the class, so no Ingress can make itself internet-facing or plain HTTP.
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: lab-alb
  annotations:
    # The CRD ships with the load balancer controller app created in wave 0;
    # retry applies this once it exists.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scheme: internal
  targetType: ip # Fargate pods are registered by IP
  group:
    name: lab-commit # one ALB serves the app, Grafana and Argo CD
  certificateArn:
    - {{ include "apps.required" (dict "key" "certificateArn" "value" .Values.certificateArn) }}
  inboundCIDRs:
    - {{ include "apps.required" (dict "key" "vpcCidr" "value" .Values.vpcCidr) }}
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: lab-alb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
    kind: IngressClassParams
    name: lab-alb
