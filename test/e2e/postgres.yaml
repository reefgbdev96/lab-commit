# Throwaway PostgreSQL for the kind e2e only. Lives outside the restricted demo
# namespace because the official image starts as root.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: e2e-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: labdb }
            - { name: POSTGRES_PASSWORD, value: e2e } # test-only
          ports:
            - containerPort: 5432
          readinessProbe:
            # Over TCP: on first boot the image runs initdb on a temporary,
            # socket-only server, so a socket probe goes Ready too early.
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, labdb]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: e2e-db
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
